<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="stylesheet" href="../style/login.css">

</head>
<body>

<div class="mobile-screen">

    <div class="criar-wishlist-container">

                <label for="nomeTexto">Nome</label>
                <input type="text" id="nomeTexto" name="nome" required>

                <label for="descricaoTexto">Descrição</label>

            </div>
            <button type="submit" class="button" onclick="criarCompromissoWIshlist()">
                CRIAR
            </button>
        </form>
    </div>
</div>

<script src="../scripts/script.js" defer></script>
<script src="../scripts/criarCompromisso.js" defer></script>
