<!-- index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- O script deve ser carregado no final do body para melhor performance,
       mas no head com 'defer' também funciona bem. -->
  <script src="../scripts/script.js" defer></script>
  <title>App Calendário</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>

<div class="mobile-screen">
  <header>
    <div class="menu-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <main class="content">
    <a>
      <section class="card">
        <h2>Calendário ></h2>
        <!-- Este é o container que o JS vai preencher. -->
        <div class="calendarioItens">
          <!-- O conteúdo aqui será adicionado dinamicamente pelo script.js -->
        </div>
      </section>
    </a>

    <a class="card-link">
      <section class="card">
        <h2>Wishlist ></h2>
        <!-- ADICIONE A CLASSE 'wishlistItens' AQUI -->
        <div class="wishlistItens">
          <!-- O conteúdo da wishlist será adicionado aqui -->
        </div>
      </section>
    </a>
  </main>
</div>

</body>
</html>
